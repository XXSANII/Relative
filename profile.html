<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile | ทะเบียนเครือญาติ</title><link rel="stylesheet" href="style.css"></head><body><header class="banner"><div class="wrap"><a class="brand" href="main.html">ทะเบียนเครือญาติ</a><button id="homeBtn" class="navbtn">หน้า Home</button><button id="logoutBtn" class="navbtn">ออกจากระบบ</button></div></header><main class="wrap"><section class="card"><div id="message" hidden></div><div id="view"><div class="profile-head"><img id="avatar" class="avatar" alt="รูปโปรไฟล์"><div><h1 id="name"></h1><p id="ownerLabel" class="muted"></p></div></div><div class="row"><strong>เพศ</strong><span id="gender"></span></div><div class="row"><strong>เบอร์โทร</strong><span id="phone"></span></div><div class="row"><strong>ที่อยู่</strong><span id="address"></span></div><div class="row"><strong>พ่อ</strong><span id="father"></span></div><div class="row"><strong>แม่</strong><span id="mother"></span></div><div class="row"><strong>คู่สมรส</strong><span id="spouse"></span></div><div id="ownerActions" class="actions" hidden><button id="editBtn">แก้ไขข้อมูลของฉัน</button><button id="deleteBtn" class="danger">ลบข้อมูลของฉัน</button></div></div><form id="editForm" hidden><h2>แก้ไขข้อมูลของฉัน</h2><label for="e_name">ชื่อ-นามสกุล</label><input id="e_name" required><label for="e_phone">เบอร์โทรศัพท์</label><input id="e_phone" type="tel" required><label for="e_gender">เพศ</label><select id="e_gender"><option value="">ไม่ระบุ</option><option value="male">ชาย</option><option value="female">หญิง</option><option value="other">อื่น ๆ</option></select><label for="e_address">ที่อยู่</label><textarea id="e_address" rows="2"></textarea><label for="e_avatar">รูปโปรไฟล์ใหม่ (ไม่บังคับ)</label><input id="e_avatar" type="file" accept="image/jpeg,image/png,image/webp"><img id="e_preview" class="preview" hidden alt="ตัวอย่างรูปใหม่"><div class="actions"><button type="submit" id="saveBtn">บันทึก</button><button type="button" id="cancelBtn" class="ghost">ยกเลิก</button></div></form></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="common.js"></script><script src="profile.js"></script></body></html>
