<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>เข้าสู่ระบบ | ทะเบียนเครือญาติ</title><link rel="stylesheet" href="style.css"></head><body><header class="banner"><div class="wrap"><a class="brand" href="login.html">ทะเบียนเครือญาติ</a><button id="homeBtn" class="navbtn">หน้า Home</button></div></header><main class="wrap"><section class="card"><h1>เข้าสู่ระบบ</h1><p class="muted">Username คือชื่อจริง (ไม่ต้องใส่นามสกุล) และ Password คือเบอร์โทรศัพท์ที่ใช้ลงทะเบียน</p><div id="message" hidden></div><form id="loginForm"><label for="username">Username (ชื่อจริง)</label><input id="username" required autocomplete="username" placeholder="เช่น สมชาย"><label for="password">Password (เบอร์โทรศัพท์)</label><input id="password" type="password" inputmode="tel" required autocomplete="current-password" placeholder="เช่น 0812345678"><button id="submitBtn" type="submit">เข้าสู่ระบบ</button></form><p class="muted">ยังไม่มีบัญชี? <a href="register.html">ลงทะเบียน</a></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="common.js"></script><script src="login.js"></script></body></html>
