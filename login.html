<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>เข้าสู่ระบบ | ทะเบียนเครือญาติ</title>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ทะเบียนเครือญาติ" />
    <meta property="og:title" content="ทะเบียนเครือญาติ" />
    <meta property="og:description" content="ลงทะเบียนสมาชิกและดูต้นไม้ครอบครัวของเครือญาติ" />
    <meta property="og:url" content="https://relative-gules.vercel.app/login.html" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="800" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="banner">
      <div class="wrap">
        <a class="brand" href="login.html">ทะเบียนเครือญาติ</a
        ><button id="homeBtn" class="navbtn">หน้า Home</button>
      </div>
    </header>
    <main class="wrap narrow">
      <section class="card auth-card">
        <div class="auth-head">
          <div class="auth-icon" aria-hidden="true">🌳</div>
          <h1>เข้าสู่ระบบ</h1>
          <p class="muted">ยินดีต้อนรับสู่ทะเบียนเครือญาติ</p>
        </div>
        <div id="message" hidden></div>
        <form id="loginForm">
          <label for="username">Username (ชื่อจริง)</label
          ><input
            id="username"
            required
            autocomplete="username"
            placeholder="เช่น สมชาย"
          />
          <p class="hint muted">ใช้ชื่อจริงอย่างเดียว ไม่ต้องใส่นามสกุล</p>
          <label for="password">Password (วันเดือนปีเกิด)</label
          ><input
            id="password"
            type="password"
            inputmode="numeric"
            required
            autocomplete="current-password"
            placeholder="DDMMYYYY เช่น 22032547"
          />
          <p class="hint muted">
            รูปแบบ DDMMYYYY ปี พ.ศ. · บัญชีที่สมัครก่อนเปลี่ยนระบบยังใช้เบอร์โทรศัพท์ได้
          </p>
          <button id="submitBtn" type="submit">เข้าสู่ระบบ</button>
        </form>
        <div class="auth-foot">
          ยังไม่มีบัญชี? <a href="register.html">ลงทะเบียน</a>
        </div>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/shared/common.js"></script>
    <script src="js/pages/login.js"></script>
  </body>
</html>
