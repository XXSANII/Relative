<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ลงทะเบียน | ทะเบียนเครือญาติ</title><link rel="stylesheet" href="style.css"></head><body><header class="banner"><div class="wrap"><a class="brand" href="register.html">ทะเบียนเครือญาติ</a><button id="homeBtn" class="navbtn">หน้า Home</button></div></header><main class="wrap"><section class="card"><h1>สร้างบัญชี / ลงทะเบียน</h1><p class="muted">ชื่อจริงใช้เป็น Username และเบอร์โทรศัพท์ใช้เป็น Password สำหรับเข้าสู่ระบบ</p><div id="message" hidden></div><form id="registerForm"><label for="firstName">ชื่อจริง (Username) *</label><input id="firstName" required autocomplete="given-name" maxlength="60"><label for="lastName">นามสกุล *</label><input id="lastName" required autocomplete="family-name" maxlength="60"><label for="phone">เบอร์โทรศัพท์ (Password) *</label><input id="phone" required type="tel" autocomplete="new-password" placeholder="เช่น 0812345678" minlength="8" maxlength="20"><label for="gender">เพศ</label><select id="gender"><option value="">ไม่ระบุ</option><option value="male">ชาย</option><option value="female">หญิง</option><option value="other">อื่น ๆ</option></select><label for="address">ที่อยู่</label><textarea id="address" rows="2"></textarea><label for="father">ชื่อพ่อ (ถ้าทราบ)</label><input id="father" list="peopleList"><label for="mother">ชื่อแม่ (ถ้าทราบ)</label><input id="mother" list="peopleList"><label for="claimCode">รหัสยืนยัน (กรณีมีข้อมูลบุคคลเดิมในระบบ)</label><input id="claimCode" autocomplete="off" placeholder="กรอก Claim Code ถ้ามี"><p class="hint">หากมีชื่ออยู่ในทะเบียนแล้ว ต้องใช้รหัสยืนยันจากผู้ดูแลเพื่อเชื่อมบัญชีเดิม หากยังไม่มีข้อมูล ระบบจะสร้างข้อมูลใหม่ให้</p><label for="avatar">รูปโปรไฟล์ (ไม่บังคับ)</label><input id="avatar" type="file" accept="image/jpeg,image/png,image/webp"><img id="preview" class="preview" alt="ตัวอย่างรูป" hidden><datalist id="peopleList"></datalist><button id="submitBtn" type="submit">ลงทะเบียนและเข้า Home</button></form><p class="muted">มีบัญชีแล้ว? <a href="login.html">เข้าสู่ระบบ</a></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="common.js"></script><script src="register.js"></script></body></html>
